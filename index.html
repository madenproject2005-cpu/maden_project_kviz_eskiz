<style>
  :root{
    --navy:#0F2340;
    --panel:#152C4E;
    --panel-hi:#1B345B;
    --ink:#091729;
    --chalk:#EEF2F6;
    --muted:#8CA0B8;
    --sand:#D9C9A8;
    --redline:#C1502E;
    --redline-soft:rgba(193,80,46,0.14);
    --line:rgba(238,242,246,0.14);
    --radius:3px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .grid-bg{
    position:fixed;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(238,242,246,0.05) 0, rgba(238,242,246,0.05) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(238,242,246,0.05) 0, rgba(238,242,246,0.05) 1px, transparent 1px, transparent 32px);
    pointer-events:none;
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:20px 20px 60px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:8px 0 24px;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.08em;
    color:var(--chalk);
    white-space:nowrap;
  }
  .brand .dot{color:var(--redline);}

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
    justify-content:flex-end;
  }
  .mini-house{width:34px;height:28px;flex-shrink:0;opacity:0.9;}
  .mini-house path{
    fill:none;
    stroke:var(--chalk);
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke-dashoffset 0.7s ease;
  }
  .progress-track{
    position:relative;
    height:2px;
    width:96px;
    background:var(--line);
    display:none;
  }
  .progress-fill{
    position:absolute;left:0;top:0;bottom:0;
    width:0%;
    background:var(--redline);
    transition:width 0.5s ease;
  }
  .step-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }

  @media (min-width:480px){
    .progress-track{display:block;}
  }

  /* ---------- stage / card ---------- */
  main{flex:1;display:flex;flex-direction:column;justify-content:center;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:36px 28px;
    position:relative;
    animation:fadeIn 0.45s ease;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--sand);
    text-transform:uppercase;
    margin:0 0 10px;
  }
  h1,h2{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    margin:0 0 24px;
    line-height:1.25;
  }
  h1{font-size:30px;}
  h2{font-size:24px;}
  p.lead{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    margin:0 0 28px;
  }

  /* ---------- choice grid ---------- */
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .choices.single-col{grid-template-columns:1fr;}

  .choice{
    position:relative;
    background:transparent;
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    text-align:left;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .choice::before,.choice::after{
    content:'';
    position:absolute;
    width:7px;height:7px;
    border-color:transparent;
    border-style:solid;
    transition:border-color 0.2s ease;
  }
  .choice::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
  .choice::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
  .choice:hover{border-color:rgba(238,242,246,0.35);}
  .choice:focus-visible{outline:2px solid var(--redline);outline-offset:2px;}
  .choice.selected{
    border-color:var(--redline);
    background:var(--redline-soft);
  }
  .choice.selected::before,.choice.selected::after{border-color:var(--redline);}
  .choice .sub{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
  }

  /* ---------- slider ---------- */
  .slider-block{margin-bottom:8px;}
  .slider-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:44px;
    font-weight:600;
    color:var(--chalk);
    margin-bottom:18px;
  }
  .slider-value span{font-size:20px;color:var(--muted);margin-left:6px;}
  input[type="range"]{
    -webkit-appearance:none;
    width:100%;
    height:2px;
    background:var(--line);
    outline:none;
    margin:10px 0 6px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--redline);
    cursor:pointer;
    border:3px solid var(--panel);
    box-shadow:0 0 0 1px var(--redline);
  }
  input[type="range"]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;
    background:var(--redline);cursor:pointer;
    border:3px solid var(--panel);box-shadow:0 0 0 1px var(--redline);
  }
  .slider-scale{
    display:flex;justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--muted);
  }

  /* ---------- contact form ---------- */
  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    font-size:17px;
    padding:8px 2px;
    outline:none;
    transition:border-color 0.2s ease;
  }
  .field input:focus{border-color:var(--redline);}
  .field input::placeholder{color:rgba(140,160,184,0.5);}

  /* ---------- nav buttons ---------- */
  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:28px;
    gap:12px;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    border-radius:var(--radius);
    padding:14px 22px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    display:inline-block;
    text-decoration:none;
    line-height:1.2;
  }
  .btn-primary{
    background:var(--redline);
    color:#fff;
    margin-left:auto;
  }
  .btn-primary:hover{background:#a8461f;}
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed;background:var(--redline);}
  .btn-primary:focus-visible{outline:2px solid var(--sand);outline-offset:2px;}
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border-color:var(--line);
  }
  .btn-ghost:hover{color:var(--chalk);border-color:rgba(238,242,246,0.35);}
  .btn-ghost:focus-visible{outline:2px solid var(--redline);outline-offset:2px;}

  /* ---------- start screen ---------- */
  .start-house{width:100%;max-width:280px;height:auto;margin:0 auto 28px;display:block;}
  .start-house path{
    fill:none;stroke:var(--chalk);stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .start-house .seg{
    stroke-dasharray:400;
    stroke-dashoffset:400;
    animation:draw 2.4s ease forwards;
  }
  @media (prefers-reduced-motion: reduce){
    .start-house .seg{animation:none;stroke-dashoffset:0;}
  }
  @keyframes draw{to{stroke-dashoffset:0;}}
  .start-wrap{text-align:center;}
  .start-wrap h1{font-size:32px;}
  .start-wrap .lead{max-width:420px;margin-left:auto;margin-right:auto;}
  .start-wrap .btn-primary{margin:0 auto;display:inline-block;}
  .meta-row{
    display:flex;justify-content:center;gap:22px;margin-top:26px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
  }

  /* ---------- result screen ---------- */
  .result-house{width:100%;max-width:260px;height:auto;margin:0 auto 20px;display:block;}
  .result-house path{fill:none;stroke:var(--chalk);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .spec-table{
    width:100%;
    border-collapse:collapse;
    margin:24px 0;
    font-size:14px;
  }
  .spec-table td{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .spec-table td:first-child{color:var(--muted);}
  .spec-table td:last-child{
    text-align:right;
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
  }
  .result-figures{
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin:22px 0;
  }
  .result-figures .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .result-figures .row:last-child{margin-bottom:0;}
  .result-figures .rlabel{font-size:13px;color:var(--muted);}
  .result-figures .rvalue{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;font-weight:600;color:var(--sand);
    text-align:right;
  }
  .disclaimer{
    font-size:12px;color:var(--muted);line-height:1.6;margin-top:18px;
  }
  .success-box{text-align:center;padding:20px 0;}
  .success-box .check{
    width:52px;height:52px;border-radius:50%;
    border:2px solid var(--redline);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
    font-size:22px;color:var(--redline);
  }

  @media (max-width:420px){
    .choices{grid-template-columns:1fr;}
    .card{padding:28px 20px;}
    h1{font-size:24px;}
    .slider-value{font-size:36px;}
  }
</style>
</head>
